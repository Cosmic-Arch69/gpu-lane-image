name: build-lane-image
on: workflow_dispatch
# Static build, no CUDA driver at link time -> one file in the image, no .so wrangling.
# Image must be PUBLIC (Yotta pulls anonymous; private ghcr needs a PAT in the console).
jobs:
  bake:
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          docker run --rm -v "$PWD:/w" -w /w nvidia/cuda:12.8.1-devel-ubuntu22.04 bash -c '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends cmake ninja-build git libgomp1
            git clone --depth 1 https://github.com/ggml-org/llama.cpp /src
            git -C /src checkout 8e2d31e
            cmake -S /src -B /b -G Ninja -DGGML_CUDA=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_CUDA_ARCHITECTURES=86
            cmake --build /b --target llama-server -j3
            cp /b/bin/llama-server /w/'
      - run: docker build -t lane .
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u x --password-stdin
        env: GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: docker tag lane ghcr.io/cosmic-arch69/qwen-lane:jonathan && docker push ghcr.io/cosmic-arch69/qwen-lane:jonathan
