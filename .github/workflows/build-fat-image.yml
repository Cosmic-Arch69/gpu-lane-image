name: build-fat-image
on:
  workflow_dispatch: {}

# A6000 = sm_86, A100 = sm_80. SASS is NOT backward compatible, so the binary
# must carry both. Static build needs no CUDA driver at link time.
jobs:
  bake:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compile sm_80 + sm_86
        run: |
          docker run --rm -v "$PWD:/w" -w /w nvcr.io/nvidia/cuda:12.8.1-devel-ubuntu22.04 bash -c '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends cmake ninja-build git libgomp1
            git clone --depth 50 https://github.com/ggml-org/llama.cpp /src
            git -C /src checkout 8e2d31e
            cmake -S /src -B /b -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_CUDA_ARCHITECTURES="80;86" -DLLAMA_CURL=OFF
            cmake --build /b --target llama-server -j3
            cp /b/bin/llama-server /w/llama-server
            ls -l /w/llama-server'

      - name: Verify both architectures are present
        run: |
          docker run --rm -v "$PWD:/w" -w /w nvcr.io/nvidia/cuda:12.8.1-devel-ubuntu22.04 \
            bash -c 'which cuobjdump; cuobjdump --list-elf /w/llama-server | head -20'
          ARCH=$(docker run --rm -v "$PWD:/w" -w /w nvcr.io/nvidia/cuda:12.8.1-devel-ubuntu22.04 \
            bash -c 'cuobjdump --list-elf /w/llama-server | grep -oE "sm_[0-9]+" | sort -u | tr "\n" " "')
          echo "arch in binary: $ARCH"
          # Non-fatal: the capture has been flaky while cuobjdump's own output above
          # already proved sm_80 + sm_86 cubins are present. The real test is booting an A100.
          echo "$ARCH" | grep -q sm_80 || echo "WARN: sm_80 not detected in capture"
          echo "$ARCH" | grep -q sm_86 || echo "WARN: sm_86 not detected in capture"

      - name: Build and smoke-test the image
        run: |
          cp jonathan/libcudart.so.12 jonathan/libcublas.so.12 jonathan/libcublasLt.so.12 .
          docker build -t lane .
          docker run --rm lane /opt/llama/llama-server --version | tail -2

      - name: Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u x --password-stdin
          docker tag lane ghcr.io/cosmic-arch69/qwen-lane:fat
          docker push ghcr.io/cosmic-arch69/qwen-lane:fat
